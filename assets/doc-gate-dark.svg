<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 56 760 404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="An edit commits on its own only if two agents agree and every check passes">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<g fill="none" stroke="#6e7681" stroke-width="1.25">
<path d="M180.0 108.0H212.0" marker-end="url(#arrow)"/>
<path d="M364.0 108.0H396.0" marker-end="url(#arrow)"/>
<path d="M548.0 108.0H580.0" marker-end="url(#arrow)"/>
<path d="M656 144V256.0H600" marker-end="url(#arrow)"/>
<path d="M272 316V364" marker-end="url(#arrow)"/>
<path d="M560 316V364" marker-end="url(#arrow)"/>
</g>
<rect x="28.0" y="72" width="152" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<text x="104" y="96" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Hourly code sync</text>
<text x="104" y="116" font-size="11.5" text-anchor="middle" fill="#9198a1">incremental run,</text>
<text x="104" y="132" font-size="11.5" text-anchor="middle" fill="#9198a1">one per repo</text>
<rect x="212.0" y="72" width="152" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<text x="288" y="96" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Generator agent</text>
<text x="288" y="116" font-size="11.5" text-anchor="middle" fill="#9198a1">proposes the edit,</text>
<text x="288" y="132" font-size="11.5" text-anchor="middle" fill="#9198a1">rates its confidence</text>
<rect x="396.0" y="72" width="152" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<text x="472" y="96" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Reviewer agent</text>
<text x="472" y="116" font-size="11.5" text-anchor="middle" fill="#9198a1">fresh session,</text>
<text x="472" y="132" font-size="11.5" text-anchor="middle" fill="#9198a1">approves or rejects</text>
<rect x="580.0" y="72" width="152" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<text x="656" y="96" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Generator revises</text>
<text x="656" y="116" font-size="11.5" text-anchor="middle" fill="#9198a1">once, per the review</text>
<rect x="232" y="196" width="368" height="120" rx="8" fill="#4493f8" fill-opacity="0.12" stroke="#4493f8" stroke-width="2"/>
<text x="248" y="220" font-size="13" font-weight="600" fill="#e6edf3">Auto-apply gate: every check must hold</text>
<text x="248" y="240" font-size="11.5" fill="#e6edf3">Generator agrees and reviewer approves</text>
<text x="248" y="256" font-size="11.5" fill="#e6edf3">Both confidences 0.85 or higher</text>
<text x="248" y="272" font-size="11.5" fill="#e6edf3">No risk flag, such as funds or permissions</text>
<text x="248" y="288" font-size="11.5" fill="#e6edf3">No conflict with another repo</text>
<text x="248" y="304" font-size="11.5" fill="#e6edf3">Doc file unchanged since the run began</text>
<rect x="172.0" y="364" width="200" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<text x="272" y="388" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Human queue</text>
<text x="272" y="408" font-size="11.5" text-anchor="middle" fill="#9198a1">a person applies or ignores;</text>
<text x="272" y="424" font-size="11.5" text-anchor="middle" fill="#9198a1">admin-started full runs too</text>
<rect x="460.0" y="364" width="200" height="72" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"/>
<text x="560" y="388" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Commit and push</text>
<text x="560" y="408" font-size="11.5" text-anchor="middle" fill="#9198a1">file hash re-checked,</text>
<text x="560" y="424" font-size="11.5" text-anchor="middle" fill="#9198a1">tagged with the edit id</text>
<text x="280" y="346" font-size="11.5" fill="#9198a1">any check fails</text>
<text x="568" y="346" font-size="11.5" fill="#9198a1">all hold</text>
</svg>
