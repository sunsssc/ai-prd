<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ai-prd 知识库原型</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ea;
      --surface: #fbfaf6;
      --surface-strong: #ffffff;
      --surface-muted: #f3efe6;
      --paper: #f8f4ec;
      --paper-deep: #efe7da;
      --text: #161514;
      --text-soft: #5d5b56;
      --text-faint: #8a867e;
      --line: #e7e2d6;
      --line-soft: #f0ebe1;
      --brand: #c96442;
      --brand-deep: #a65034;
      --brand-soft: #f4ddd2;
      --olive: #5e6a52;
      --olive-soft: #e5ebdd;
      --sand: #f3e5c4;
      --sand-deep: #916f2d;
      --stone: #e8ddd0;
      --stone-deep: #6d594b;
      --shadow-lg: 0 18px 40px rgba(22, 21, 20, 0.06);
      --shadow-md: 0 8px 26px rgba(22, 21, 20, 0.05);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --rail-width: 56px;
      --sidebar-width: 288px;
      --shell-padding: clamp(8px, 1.2vw, 20px);
      --font-serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif;
      --font-sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fcfaf5;
      color: var(--text);
      font-family: var(--font-sans);
    }

    body {
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .app-shell {
      position: relative;
      display: grid;
      grid-template-columns: var(--rail-width) minmax(0, 1fr);
      gap: 0;
      width: 100vw;
      min-height: 100vh;
    }

    .app-shell.sidebar-expanded {
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .panel {
      background: rgba(251, 250, 246, 0.88);
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .layout-sidebar {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 12px 16px;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #faf8f2, #f7f4ec);
      border-right: 1px solid var(--line-soft);
      transition: transform 220ms ease, box-shadow 220ms ease, opacity 180ms ease, visibility 180ms ease;
    }

    .app-shell:not(.sidebar-expanded) .layout-sidebar {
      padding-left: 8px;
      padding-right: 8px;
    }

    .app-shell.sidebar-expanded .main-shell {
      border-left: none;
    }

    .sidebar-toggle-button,
    .pane-toggle-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-soft);
      box-shadow: var(--shadow-md);
    }

    .sidebar-toggle-button {
      width: 36px;
      height: 36px;
      padding: 0;
      font-size: 1rem;
    }

    .pane-toggle-button {
      padding: 8px 12px;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .sidebar-header,
    .detail-head,
    .tree-toolbar,
    .button-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sidebar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .sidebar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #faf9f5;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: #2f2d2b;
    }

    .brand-copy h1,
    .pane-title,
    .detail-title,
    .section-label {
      margin: 0;
    }

    .brand-copy h1,
    .pane-title,
    .detail-title,
    .section-label {
      font-family: var(--font-serif);
      font-weight: 500;
    }

    .brand-copy h1 {
      font-size: 1.38rem;
    }

    .brand-copy p,
    .muted,
    .nav-copy p,
    .detail-card p,
    .meta-line,
    .child-card p,
    .overview-card p,
    .preview-card p {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.65;
      font-size: 0.96rem;
    }

    .nav-block {
      display: grid;
      gap: 8px;
      padding: 4px 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      color: var(--text-soft);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .nav-item:hover {
      transform: translateX(2px);
    }

    .nav-item.active {
      background: var(--surface-muted);
      border-color: var(--line);
      color: var(--text);
    }

    .nav-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      flex: 0 0 auto;
    }

    .nav-icon.blue {
      background: var(--brand-soft);
      color: var(--brand-deep);
    }

    .nav-icon.pink {
      background: #f2e7d3;
      color: #866633;
    }

    .nav-icon.green {
      background: var(--olive-soft);
      color: var(--olive);
    }

    .nav-copy strong,
    .detail-card strong,
    .launch-copy strong,
    .child-card strong,
    .preview-card strong,
    .overview-card strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .subnav {
      display: grid;
      gap: 6px;
      margin: 2px 0 10px 14px;
      padding: 2px 0 0 14px;
      border-left: 1px solid var(--line);
    }

    .sidebar-spacer {
      min-height: 8px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 8px;
    }

    .user-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 16px;
      color: var(--text-soft);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #2f2d2b;
      color: #fffaf4;
      font-weight: 600;
      flex: 0 0 auto;
    }

    .user-meta strong,
    .user-meta span {
      display: block;
    }

    .user-meta strong {
      font-size: 0.92rem;
      color: var(--text);
    }

    .user-meta span {
      font-size: 0.8rem;
      color: var(--text-faint);
    }

    .app-shell:not(.sidebar-expanded) .brand-copy,
    .app-shell:not(.sidebar-expanded) .nav-copy,
    .app-shell:not(.sidebar-expanded) .subnav,
    .app-shell:not(.sidebar-expanded) .user-meta {
      display: none;
    }

    .app-shell:not(.sidebar-expanded) .sidebar-header {
      justify-content: center;
    }

    .app-shell:not(.sidebar-expanded) .brand {
      display: none;
    }

    .app-shell:not(.sidebar-expanded) .sidebar-actions {
      width: 100%;
      justify-content: center;
    }

    .app-shell:not(.sidebar-expanded) .nav-block {
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      justify-items: center;
    }

    .app-shell:not(.sidebar-expanded) .nav-item {
      width: 40px;
      height: 40px;
      padding: 0;
      justify-content: center;
      border-radius: 14px;
    }

    .app-shell:not(.sidebar-expanded) .sidebar-footer {
      padding-top: 0;
    }

    .app-shell:not(.sidebar-expanded) .user-status {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .subnav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-soft);
      text-align: left;
    }

    .subnav-item:hover {
      background: rgba(243, 239, 230, 0.52);
      border-color: var(--line-soft);
      transform: none;
    }

    .subnav-item.active {
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--line);
      color: var(--text);
      box-shadow: none;
    }

    .subnav-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .subnav-copy strong {
      font-size: 0.92rem;
    }

    .subnav-copy span {
      color: var(--text-faint);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .tiny-pill,
    .source-pill,
    .meta-pill,
    .ghost-button,
    .primary-button,
    .tree-toolbar button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line);
      background: var(--surface-muted);
      color: var(--text-soft);
      padding: 8px 12px;
      font-size: 0.84rem;
    }

    .tiny-pill.blue,
    .source-pill.blue {
      background: var(--brand-soft);
      border-color: #e6cdc1;
      color: var(--brand-deep);
    }

    .tiny-pill.green,
    .source-pill.green {
      background: var(--olive-soft);
      border-color: #d6decf;
      color: var(--olive);
    }

    .tiny-pill.yellow,
    .source-pill.yellow {
      background: #f6ecd4;
      border-color: #ebd8ab;
      color: var(--sand-deep);
    }

    .source-pill.stone,
    .meta-pill.stone {
      background: var(--stone);
      border-color: #dcccbc;
      color: var(--stone-deep);
    }

    .ghost-button,
    .primary-button,
    .tree-toolbar button {
      justify-content: center;
      background: var(--surface-muted);
    }

    .ghost-button:hover,
    .primary-button:hover,
    .tree-toolbar button:hover {
      transform: translateY(-1px);
    }

    .primary-button {
      background: var(--brand);
      border-color: var(--brand);
      color: #fffaf6;
    }

    .main-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      min-width: 0;
      background: #fffdf8;
    }

    .workspace-shell {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 0;
      padding: 0;
      height: 100%;
    }

    .workspace-shell.tree-collapsed {
      grid-template-columns: 76px minmax(0, 1fr);
    }

    .tree-pane,
    .detail-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .tree-pane {
      border-right: 1px solid var(--line-soft);
      border-radius: 0;
      border-left: none;
      border-top: none;
      border-bottom: none;
      box-shadow: none;
      overflow: hidden;
      transition: width 220ms ease, min-width 220ms ease;
      background: #fbfaf6;
    }

    .pane-head {
      padding: 18px 20px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .pane-head-main {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .pane-title {
      font-size: 1.02rem;
      line-height: 1.2;
    }

    .tree-toolbar {
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 8px;
    }

    .tree-toolbar button {
      background: rgba(255, 255, 255, 0.82);
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    .tree-body {
      padding: 8px 10px 14px;
      overflow: auto;
      display: grid;
      gap: 2px;
    }

    .workspace-shell.tree-collapsed .tree-pane {
      align-items: stretch;
    }

    .workspace-shell.tree-collapsed .pane-head {
      padding: 14px 10px;
      align-items: center;
      justify-content: center;
    }

    .workspace-shell.tree-collapsed .pane-head-main,
    .workspace-shell.tree-collapsed .tree-body {
      display: none;
    }

    .workspace-shell.tree-collapsed .pane-toggle-button {
      width: 100%;
      min-height: 44px;
    }

    .tree-node {
      display: grid;
      gap: 2px;
    }

    .tree-node-row {
      display: grid;
      grid-template-columns: 18px 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 7px 10px;
      padding-left: calc(10px + var(--depth, 0) * 14px);
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      color: var(--text-soft);
    }

    .tree-node-row:hover {
      background: rgba(243, 239, 230, 0.56);
      border-color: var(--line-soft);
      transform: none;
    }

    .tree-node-row.active {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(244, 239, 230, 0.95));
      border-color: #d7c7b6;
      box-shadow: none;
      color: var(--text);
    }

    .tree-node-row.folder {
      font-weight: 500;
    }

    .tree-toggle {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-faint);
      padding: 0;
      font-size: 0.72rem;
    }

    .tree-toggle:hover {
      background: rgba(255, 255, 255, 0.72);
      border-color: var(--line-soft);
      transform: none;
    }

    .tree-toggle.placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .tree-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 0.62rem;
      font-weight: 600;
      background: var(--surface-muted);
      color: var(--text-soft);
      border: 1px solid var(--line-soft);
    }

    .tree-icon.folder {
      background: #f6ecd4;
      color: var(--sand-deep);
      border-color: #ebd8ab;
    }

    .tree-icon.requirements {
      background: var(--brand-soft);
      color: var(--brand-deep);
      border-color: #e6cdc1;
    }

    .tree-icon.business {
      background: #f6ecd4;
      color: var(--sand-deep);
      border-color: #ebd8ab;
    }

    .tree-icon.code {
      background: var(--olive-soft);
      color: var(--olive);
      border-color: #d6decf;
    }

    .tree-label {
      min-width: 0;
      display: block;
    }

    .tree-label strong {
      margin: 0;
      font-size: 0.9rem;
      color: inherit;
      font-weight: 500;
      line-height: 1.25;
    }

    .tree-label span {
      display: none;
    }

    .tree-meta {
      font-size: 0.72rem;
      color: var(--text-faint);
      white-space: nowrap;
    }

    .tree-children {
      display: grid;
      gap: 2px;
    }

    .detail-panel {
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: auto;
      padding: 0;
      gap: 0;
      background: #fffdf8;
    }

    .detail-title {
      font-size: 1.88rem;
      line-height: 1.12;
    }

    .detail-card {
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .detail-grid,
    .preview-grid,
    .child-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .preview-card,
    .child-card {
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 244, 236, 0.88));
    }

    .detail-meta,
    .detail-relation-row,
    .pill-row,
    .path-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .overview-card {
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid #e3d8ca;
      background:
        linear-gradient(180deg, rgba(248, 244, 236, 0.9), rgba(240, 235, 225, 0.94));
    }

    .excerpt,
    .code-preview {
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid #e3d8ca;
      margin-top: 14px;
      white-space: pre-line;
      line-height: 1.85;
      color: #4f4841;
      background:
        linear-gradient(180deg, rgba(248, 244, 236, 0.9), rgba(240, 235, 225, 0.94));
    }

    .code-preview {
      font-family: var(--font-mono);
      white-space: pre-wrap;
      font-size: 0.88rem;
      line-height: 1.75;
      background:
        linear-gradient(180deg, rgba(245, 242, 236, 0.95), rgba(235, 229, 220, 0.9));
    }

    .content-shell {
      display: grid;
      gap: 0;
    }

    .content-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 0;
    }

    .content-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .content-subline {
      color: var(--text-faint);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .content-view,
    .editor-area {
      width: 100%;
      min-height: calc(100vh - 110px);
      border-radius: 0;
      border: none;
      background: transparent;
      color: #4f4841;
      box-shadow: none;
    }

    .content-view {
      margin: 0;
      padding: 20px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.75;
    }

    .content-view.markdown {
      font-family: var(--font-mono);
    }

    .editor-area {
      resize: vertical;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      line-height: 1.75;
      outline: none;
    }

    .folder-empty {
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px dashed #dbcbbb;
      background: rgba(248, 244, 236, 0.72);
      color: var(--text-soft);
      line-height: 1.7;
    }

    .empty-state {
      padding: 30px;
      border-radius: var(--radius-lg);
      border: 1px dashed #dbcbbb;
      text-align: center;
      color: var(--text-faint);
      background: rgba(248, 244, 236, 0.7);
    }

    @media (max-width: 1180px) {
      .workspace-shell,
      .detail-grid,
      .preview-grid,
      .child-grid {
        grid-template-columns: 1fr;
      }

      .workspace-shell.tree-collapsed {
        grid-template-columns: 1fr;
        grid-template-rows: 76px minmax(0, 1fr);
      }
    }

    @media (max-width: 720px) {
      .detail-panel,
      .pane-head,
      .tree-body {
        padding-left: 16px;
        padding-right: 16px;
      }

      .detail-head,
      .launch-strip {
        flex-direction: column;
        align-items: flex-start;
      }

      .tree-node-row {
        grid-template-columns: 22px 28px minmax(0, 1fr);
      }

      .tree-meta {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="panel layout-sidebar" id="layoutSidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">A.P</div>
          <div class="brand-copy">
            <h1>ai-prd</h1>
            <p>连接需求、业务文档和代码知识</p>
          </div>
        </div>
        <div class="sidebar-actions">
          <button class="sidebar-toggle-button" id="sidebarToggleButton" type="button" aria-label="切换导航">☰</button>
        </div>
      </div>

      <div class="nav-block">
        <a class="nav-item" href="ai-prd-usage-prototype.html">
          <div class="nav-icon blue">AI</div>
          <div class="nav-copy">
            <strong>AI 助手</strong>
            <p>默认会话入口</p>
          </div>
        </a>
        <a class="nav-item active" href="ai-prd-knowledge-prototype.html">
          <div class="nav-icon pink">知</div>
          <div class="nav-copy">
            <strong>知识库</strong>
            <p>通过子菜单切换三类知识源</p>
          </div>
        </a>
        <div class="subnav" id="knowledgeSubnav"></div>

    const knowledgeSubnav = document.getElementById("knowledgeSubnav");
    const treeTitle = document.getElementById("treeTitle");
    const treeBody = document.getElementById("treeBody");
    const detailPanel = document.getElementById("detailPanel");
    const expandAllButton = document.getElementById("expandAllButton");
    const collapseAllButton = document.getElementById("collapseAllButton");
    const treePaneToggleButton = document.getElementById("treePaneToggleButton");
    const TREE_COLLAPSE_KEY = "ai-prd-knowledge-tree-collapsed";

    let activeBase = "requirements";
    const selectedNodeByBase = {
      requirements: knowledgeBases.requirements.defaultNodeId,
      business: knowledgeBases.business.defaultNodeId,
      code: knowledgeBases.code.defaultNodeId
    };

    const expandedNodes = new Set();
    const editedContentById = {};
    let editingNodeId = null;
    let isSidebarExpanded = false;
    let isTreeCollapsed = false;

    function readStoredValue(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function storeValue(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (error) {
        // 文件原型环境下若无法写入 localStorage，就退回当前会话内状态。
      }
    }

    function syncSidebarState() {
      syncSidebarVisibility();
    }

    function syncSidebarVisibility() {
      const isVisible = isSidebarExpanded;
      appShell.classList.toggle("sidebar-expanded", isVisible);
      sidebarToggleButton.textContent = isVisible ? "←" : "☰";
      sidebarToggleButton.setAttribute("aria-label", isVisible ? "收起导航" : "展开导航");
      sidebarToggleButton.setAttribute("aria-expanded", String(isVisible));
    }

    function closeSidebar() {
      isSidebarExpanded = false;
      syncSidebarVisibility();
    }

    function toggleSidebar() {
      isSidebarExpanded = !isSidebarExpanded;
      syncSidebarVisibility();
    }

    function syncTreePaneState() {
      workspaceShell.classList.toggle("tree-collapsed", isTreeCollapsed);
      treePaneToggleButton.textContent = isTreeCollapsed ? "展开目录" : "收起目录";
      treePaneToggleButton.setAttribute("aria-pressed", String(!isTreeCollapsed));
      treePaneToggleButton.setAttribute("title", isTreeCollapsed ? "展开知识库目录树" : "收起知识库目录树");
    }

    function countFiles(node) {
      if (!node) {
        return 0;
      }
      if (node.kind === "file") {
        return 1;
      }
      return (node.children || []).reduce((total, child) => total + countFiles(child), 0);
    }

    function countFolders(node) {
      if (!node || node.kind === "file") {
        return 0;
      }
      return 1 + (node.children || []).reduce((total, child) => total + countFolders(child), 0);
    }

    function collectDefaultExpanded(node) {
      if (!node || node.kind !== "folder") {
        return;
      }
      expandedNodes.add(node.id);
      (node.children || []).forEach((child) => {
        if (child.kind === "folder") {
          collectDefaultExpanded(child);
        }
      });
    }

    Object.values(knowledgeBases).forEach((base) => collectDefaultExpanded(base.tree));

    function getBase() {
      return knowledgeBases[activeBase];
    }

    function getSelectedNodeId() {
      return selectedNodeByBase[activeBase];
    }

    function setSelectedNodeId(nodeId) {
      selectedNodeByBase[activeBase] = nodeId;
    }

    function findNodeById(node, targetId) {
      if (!node) {
        return null;
      }
      if (node.id === targetId) {
        return node;
      }
      for (const child of node.children || []) {
        const result = findNodeById(child, targetId);
        if (result) {
          return result;
        }
      }
      return null;
    }

    function findPathToNode(node, targetId, trail = []) {
      if (!node) {
        return null;
      }

      const nextTrail = [...trail, node];
      if (node.id === targetId) {
        return nextTrail;
      }

      for (const child of node.children || []) {
        const result = findPathToNode(child, targetId, nextTrail);
        if (result) {
          return result;
        }
      }

      return null;
    }

    function ensureSelectedNodeExpanded() {
      const path = findPathToNode(getBase().tree, getSelectedNodeId()) || [];
      path.forEach((node) => {
        if (node.kind === "folder") {
          expandedNodes.add(node.id);
        }
      });
    }

    function ensureSelectedNode() {
      const base = getBase();
      const selected = findNodeById(base.tree, getSelectedNodeId());
      if (!selected) {
        setSelectedNodeId(base.defaultNodeId || base.tree.id);
      }
      ensureSelectedNodeExpanded();
    }

    function renderSubnav() {
      knowledgeSubnav.innerHTML = Object.entries(knowledgeBases).map(([key, base]) => `
        <button class="subnav-item ${key === activeBase ? "active" : ""}" type="button" data-base="${key}">
          <div class="subnav-copy">
            <strong>${base.label}</strong>
            <span>${base.navHint}</span>
          </div>
          <span class="meta-pill stone">${countFiles(base.tree)} 项</span>
        </button>
      `).join("");

      knowledgeSubnav.querySelectorAll(".subnav-item").forEach((button) => {
        button.addEventListener("click", () => {
          activeBase = button.dataset.base;
          ensureSelectedNode();
          renderAll();
        });
      });
    }

    function renderTreeHeader() {
      const base = getBase();
      treeTitle.textContent = `${base.label}目录`;
    }

    function renderTreeNode(node, depth) {
      const isFolder = node.kind === "folder";
      const isExpanded = expandedNodes.has(node.id);
      const isActive = node.id === getSelectedNodeId();
      const nodeType = node.type || activeBase;
      const metaText = isFolder
        ? `${countFiles(node)} 个文件`
        : node.status || typeMap[nodeType].label;
      const iconClass = isFolder ? "folder" : nodeType;
      const iconLabel = isFolder ? "DIR" : typeMap[nodeType].treeIcon;
      const title = isFolder ? node.name : (node.name || node.title);
      const subtitle = "";

      return `
        <div class="tree-node">
          <div class="tree-node-row ${isActive ? "active" : ""} ${isFolder ? "folder" : "file"}" style="--depth: ${depth};" data-select-id="${node.id}">
            <button class="tree-toggle ${isFolder ? "" : "placeholder"}" type="button" data-toggle-id="${node.id}">
              ${isFolder ? (isExpanded ? "-" : "+") : "+"}
            </button>
            <div class="tree-icon ${iconClass}">${iconLabel}</div>
            <div class="tree-label">
              <strong>${title}</strong>
              <span>${subtitle}</span>
            </div>
            <div class="tree-meta">${metaText}</div>
          </div>
          ${isFolder && isExpanded ? `
            <div class="tree-children">
              ${(node.children || []).map((child) => renderTreeNode(child, depth + 1)).join("")}
            </div>
          ` : ""}
        </div>
      `;
    }

    function renderTree() {
      const base = getBase();
      treeBody.innerHTML = renderTreeNode(base.tree, 0);

      treeBody.querySelectorAll("[data-toggle-id]").forEach((button) => {
        if (button.classList.contains("placeholder")) {
          return;
        }
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const nodeId = button.dataset.toggleId;
          if (expandedNodes.has(nodeId)) {
            expandedNodes.delete(nodeId);
          } else {
            expandedNodes.add(nodeId);
          }
          renderTree();
        });
      });

      treeBody.querySelectorAll("[data-select-id]").forEach((row) => {
        row.addEventListener("click", () => {
          const nodeId = row.dataset.selectId;
          setSelectedNodeId(nodeId);
          ensureSelectedNodeExpanded();
          renderTree();
          renderDetail();
        });
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function getFileLanguage(node) {
      if (node.contentType) {
        return node.contentType;
      }
      return node.type === "code" ? "code" : "markdown";
    }

    function buildDefaultContent(node) {
      if (node.content) {
        return node.content;
      }

      if (node.type === "code") {
        return node.codePreview || node.excerpt || "";
      }

      const sections = [
        `# ${node.title}`,
        "",
        node.summary || "",
        "",
        "## 内容摘录",
        node.excerpt || "暂无内容"
      ];

      if (node.related && node.related.length) {
        sections.push("", "## 关联上下文");
        node.related.forEach((item) => {
          sections.push(`- ${item.label}`);
        });
      }

      return sections.join("\n");
    }

    function getNodeContent(node) {
      return editedContentById[node.id] ?? buildDefaultContent(node);
    }

    function bindFileEditorEvents(node) {
      const headerEditButton = detailPanel.querySelector("#editFileButtonHeader");
      const editButton = detailPanel.querySelector("#editFileButton");
      const saveButton = detailPanel.querySelector("#saveFileButton");
      const cancelButton = detailPanel.querySelector("#cancelFileButton");
      const editor = detailPanel.querySelector("#fileEditor");

      if (headerEditButton) {
        headerEditButton.addEventListener("click", () => {
          if (editingNodeId === node.id) {
            return;
          }
          editingNodeId = node.id;
          renderFileDetail(node);
        });
      }

      if (editButton) {
        editButton.addEventListener("click", () => {
          editingNodeId = node.id;
          renderFileDetail(node);
        });
      }

      if (saveButton && editor) {
        saveButton.addEventListener("click", () => {
          editedContentById[node.id] = editor.value;
          editingNodeId = null;
          renderFileDetail(node);
        });
      }

      if (cancelButton) {
        cancelButton.addEventListener("click", () => {
          editingNodeId = null;
          renderFileDetail(node);
        });
      }
    }

    function renderFolderDetail(node) {
      const childNodes = node.children || [];

      detailPanel.innerHTML = `
        <div class="detail-head">
          <div>
            <h2 class="detail-title">${node.title || node.name}</h2>
            <div class="content-subline" style="margin-top: 6px;">${node.path}</div>
          </div>
        </div>

        <article class="detail-card">
          <div class="folder-empty">这是目录，不是文件。请在左侧目录树中选择一个具体文件查看内容；目录仅用于展开、收起和定位文件。</div>
        </article>

        <article class="detail-card">
          <h3 class="section-label">当前目录内容</h3>
          <div class="child-grid" style="margin-top: 14px;">
            ${childNodes.length ? childNodes.map((child) => `
              <div class="child-card">
                <strong>${child.name || child.title}</strong>
                <p>${child.kind === "folder" ? child.path : (child.title || child.path)}</p>
                <p class="meta-line" style="margin-top: 10px;">${child.kind === "folder" ? `${countFiles(child)} 个文件` : (child.status || "可查看")}</p>
              </div>
            `).join("") : `<div class="empty-state">当前目录下还没有内容。</div>`}
          </div>
        </article>
      `;
    }

    function renderFileDetail(node) {
      const contentType = getFileLanguage(node);
      const isEditing = editingNodeId === node.id;
      const content = getNodeContent(node);
      const escapedContent = escapeHtml(content);

      detailPanel.innerHTML = `
        <article class="detail-card">
          <div class="content-shell">
            <div class="content-toolbar">
              <div class="content-subline">${contentType === "code" ? "代码文件" : "Markdown 文件"} · ${node.updatedAt} · ${node.path}</div>
              <div class="content-actions">
                ${isEditing ? `
                  <button type="button" class="ghost-button" id="cancelFileButton">取消</button>
                  <button type="button" class="primary-button" id="saveFileButton">保存修改</button>
                ` : `
                  <button type="button" class="ghost-button" id="editFileButton">编辑内容</button>
                `}
              </div>
            </div>
            ${isEditing
              ? `<textarea class="editor-area" id="fileEditor">${escapedContent}</textarea>`
              : `<pre class="content-view ${contentType}">${escapedContent}</pre>`
            }
          </div>
        </article>
      `;

      bindFileEditorEvents(node);
    }

    function renderDetail() {
      const node = findNodeById(getBase().tree, getSelectedNodeId());
      if (!node) {
        detailPanel.innerHTML = `<div class="empty-state">未找到当前节点，请重新选择目录树中的对象。</div>`;
        return;
      }

      if (node.kind === "folder") {
        renderFolderDetail(node);
        return;
      }

      renderFileDetail(node);
    }

    function expandAllFolders(node) {
      if (!node || node.kind !== "folder") {
        return;
      }
      expandedNodes.add(node.id);
      (node.children || []).forEach(expandAllFolders);
    }

    function collapseAllFolders(node, keepId) {
      if (!node || node.kind !== "folder") {
        return;
      }
      if (node.id !== keepId) {
        expandedNodes.delete(node.id);
      }
      (node.children || []).forEach((child) => collapseAllFolders(child, keepId));
    }

    function renderAll() {
      renderSubnav();
      renderTreeHeader();
      renderTree();
      renderDetail();
    }

    isSidebarExpanded = false;
    isTreeCollapsed = readStoredValue(TREE_COLLAPSE_KEY) === "true";

    sidebarToggleButton.addEventListener("click", toggleSidebar);

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeSidebar();
      }
    });

    treePaneToggleButton.addEventListener("click", () => {
      isTreeCollapsed = !isTreeCollapsed;
      storeValue(TREE_COLLAPSE_KEY, String(isTreeCollapsed));
      syncTreePaneState();
    });

    expandAllButton.addEventListener("click", () => {
      expandAllFolders(getBase().tree);
      renderTree();
    });

    collapseAllButton.addEventListener("click", () => {
      const base = getBase();
      collapseAllFolders(base.tree, base.tree.id);
      expandedNodes.add(base.tree.id);
      setSelectedNodeId(base.tree.id);
      renderTree();
      renderDetail();
    });

    syncSidebarState();
    syncTreePaneState();
    ensureSelectedNode();
    renderAll();
  </script>
