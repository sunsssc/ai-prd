<svg width="100%" viewBox="0 0 760 770" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
  <title>Claude Agent SDK 与 Claude Code 二进制的实现拓扑</title>
  <desc>展示 SDK 与 native binary 的实际关系：Bundled CLI binary 与 PATH 上独立安装的 claude 是同一份二进制；二进制根据启动 flag 决定走 TUI 模式或 stream-json 协议模式，两种接口共享同一份内核。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="rgb(115,114,108)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 顶部标题 -->
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="rgb(40,40,40)">Claude Agent SDK 与 Claude Code 二进制的实现拓扑</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="rgb(95,94,90)">两个入口共享同一个 native binary，由启动 flag 切换接口模式</text>

  <!-- Layer 1a: Terminal user -->
  <g>
    <rect x="60" y="62" width="280" height="84" rx="12" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.6"/>
    <text x="200" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(8,80,65)">Terminal user</text>
    <text x="200" y="114" text-anchor="middle" font-size="11.5" fill="rgb(15,110,86)">人类在终端启动 claude</text>
    <text x="200" y="132" text-anchor="middle" font-size="11" fill="rgb(15,110,86)">交互式开发 / 一次性任务</text>
  </g>

  <!-- Layer 1b: Your application code -->
  <g>
    <rect x="420" y="62" width="280" height="84" rx="12" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.6"/>
    <text x="560" y="92" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(8,80,65)">Your application code</text>
    <text x="560" y="114" text-anchor="middle" font-size="11.5" fill="rgb(15,110,86)">Python / TypeScript</text>
    <text x="560" y="132" text-anchor="middle" font-size="11" fill="rgb(15,110,86)">CI/CD · 后端服务 · 自动化</text>
  </g>

  <!-- Arrow 1a: Terminal user 直达 binary 的 TUI 入口（绕过 SDK 层） -->
  <line x1="200" y1="146" x2="200" y2="424" stroke="rgb(115,114,108)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="74" y="248" font-size="11" fill="rgb(61,61,58)">直接启动 claude</text>
  <text x="74" y="264" font-size="11" fill="rgb(61,61,58)">不经过 SDK</text>

  <!-- Arrow 1b: Your code → SDK -->
  <line x1="560" y1="146" x2="560" y2="184" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="572" y="170" font-size="11" fill="rgb(61,61,58)">calls</text>

  <!-- Layer 2: Claude Agent SDK -->
  <g>
    <rect x="420" y="186" width="280" height="138" rx="12" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.6"/>
    <text x="560" y="212" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(60,52,137)">Claude Agent SDK</text>
    <text x="560" y="230" text-anchor="middle" font-size="11" fill="rgb(83,74,183)">Python / TypeScript 库 · 旧名 Claude Code SDK</text>

    <!-- 子框 1 -->
    <rect x="436" y="246" width="125" height="62" rx="6" fill="white" stroke="rgb(83,74,183)" stroke-width="0.5"/>
    <text x="498" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(60,52,137)">入口 API</text>
    <text x="498" y="283" text-anchor="middle" font-size="11" fill="rgb(83,74,183)">query()</text>
    <text x="498" y="299" text-anchor="middle" font-size="11" fill="rgb(83,74,183)">ClaudeSDKClient</text>

    <!-- 子框 2 -->
    <rect x="572" y="246" width="115" height="62" rx="6" fill="white" stroke="rgb(83,74,183)" stroke-width="0.5"/>
    <text x="629" y="266" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(60,52,137)">宿主侧扩展点</text>
    <text x="629" y="283" text-anchor="middle" font-size="11" fill="rgb(83,74,183)">Hooks · Subagents</text>
    <text x="629" y="299" text-anchor="middle" font-size="11" fill="rgb(83,74,183)">MCP · Sessions</text>
  </g>

  <!-- Arrow 2: SDK → binary 协议接口 -->
  <line x1="560" y1="324" x2="560" y2="424" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="572" y="356" font-size="11" fill="rgb(61,61,58)">spawn subprocess</text>
  <text x="572" y="372" font-size="11" fill="rgb(61,61,58)">stdio stream-json</text>
  <text x="572" y="388" font-size="11" fill="rgb(61,61,58)">(JSONL 双向)</text>

  <!-- Layer 3: claude native binary -->
  <g>
    <rect x="60" y="426" width="640" height="222" rx="12" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.6"/>
    <text x="380" y="452" text-anchor="middle" font-size="14" font-weight="600" fill="rgb(68,68,65)">claude（native binary）</text>
    <text x="380" y="470" text-anchor="middle" font-size="11" fill="rgb(95,94,90)">@anthropic-ai/claude-code · 平台预编译可执行文件 · 无 Node 包装层</text>

    <!-- 接口端点 1: TUI 模式 -->
    <rect x="80" y="484" width="280" height="58" rx="6" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.6"/>
    <text x="220" y="505" text-anchor="middle" font-size="12" font-weight="500" fill="rgb(8,80,65)">TUI 模式接口</text>
    <text x="220" y="524" text-anchor="middle" font-size="10.5" fill="rgb(15,110,86)">无协议 flag · 渲染终端 UI</text>
    <text x="220" y="538" text-anchor="middle" font-size="10.5" fill="rgb(15,110,86)">stdin = 键盘 / stdout = 屏幕</text>

    <!-- 接口端点 2: stream-json 模式 -->
    <rect x="400" y="484" width="280" height="58" rx="6" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.6"/>
    <text x="540" y="505" text-anchor="middle" font-size="12" font-weight="500" fill="rgb(60,52,137)">stream-json 协议接口</text>
    <text x="540" y="524" text-anchor="middle" font-size="10.5" fill="rgb(83,74,183)">--output-format stream-json --input-format stream-json</text>
    <text x="540" y="538" text-anchor="middle" font-size="10.5" fill="rgb(83,74,183)">stdin/stdout = JSONL · TUI 不渲染</text>

    <!-- 共享内核 -->
    <rect x="80" y="554" width="600" height="80" rx="6" fill="white" stroke="rgb(95,94,90)" stroke-width="0.5"/>
    <text x="380" y="573" text-anchor="middle" font-size="11.5" font-weight="500" fill="rgb(68,68,65)">共享内核（同一份代码与状态，被两个接口共用）</text>

    <!-- 内核组件 -->
    <text x="135" y="597" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(68,68,65)">Agent Loop</text>
    <text x="135" y="612" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">tool-call 循环</text>
    <text x="135" y="626" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">上下文压缩</text>

    <text x="240" y="597" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(68,68,65)">Built-in Tools</text>
    <text x="240" y="612" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">Read / Edit / Bash</text>
    <text x="240" y="626" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">Glob / Grep / Web</text>

    <text x="350" y="597" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(68,68,65)">Skills · CLAUDE.md</text>
    <text x="350" y="612" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">.claude/skills/*</text>
    <text x="350" y="626" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">项目记忆</text>

    <text x="465" y="597" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(68,68,65)">Sessions</text>
    <text x="465" y="612" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">JSONL 持久化</text>
    <text x="465" y="626" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">resume / fork</text>

    <text x="565" y="597" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(68,68,65)">Permissions</text>
    <text x="565" y="612" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">权限模式</text>
    <text x="565" y="626" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">allowed_tools</text>

    <text x="645" y="597" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(68,68,65)">OS Sandbox</text>
    <text x="645" y="612" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">Seatbelt</text>
    <text x="645" y="626" text-anchor="middle" font-size="10" fill="rgb(120,118,112)">bubblewrap</text>
  </g>

  <!-- Arrow 3: binary → API -->
  <line x1="380" y1="648" x2="380" y2="682" stroke="rgb(115,114,108)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="668" font-size="11" fill="rgb(61,61,58)">HTTPS API</text>

  <!-- Layer 4: API -->
  <g>
    <rect x="60" y="684" width="640" height="62" rx="12" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.6"/>
    <text x="380" y="708" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(68,68,65)">Anthropic API · AWS Bedrock · Google Vertex AI · Azure Foundry</text>
    <text x="380" y="728" text-anchor="middle" font-size="11" fill="rgb(95,94,90)">claude-sonnet · claude-opus · claude-haiku</text>
  </g>

  <!-- Source note -->
  <text x="380" y="762" text-anchor="middle" font-size="10.5" fill="rgb(95,94,90)">来源：claude-agent-sdk-python 源码（SubprocessCLITransport）· platform.claude.com/docs/en/agent-sdk/overview</text>
</svg>
